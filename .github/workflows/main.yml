name: Deploy StudyFlow to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update Supabase JS client
        run: npm install @supabase/supabase-js@2.117.1 --no-save

      - name: Verify Supabase API credentials
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -e
          code=$(curl -sS -o /tmp/supabase-response.txt -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/studyflow_state?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "Supabase REST check HTTP status: $code"
          case "$code" in
            2*)
              echo "Supabase API credentials accepted."
              ;;
            401)
              echo "Supabase rejected the API key (401 Unauthorized). Check that VITE_SUPABASE_ANON_KEY is the publishable key from this exact Supabase project."
              exit 1
              ;;
            403)
              echo "Supabase accepted the API key but denied this table request (403). Check Data API exposure and RLS policies."
              cat /tmp/supabase-response.txt
              exit 1
              ;;
            *)
              echo "Unexpected Supabase HTTP status: $code"
              cat /tmp/supabase-response.txt
              exit 1
              ;;
          esac

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
